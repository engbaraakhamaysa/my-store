<div class="cart-container">
  <div class="cart-panel">
    <h1>My Cart 🛒</h1>

    <div *ngFor="let item of cartItems" class="cart-item">
      <img [src]="item.product.url" />

      <div class="cart-item-details">
        <h3>{{ item.product.name }}</h3>
        <p>{{ item.product.price }} $</p>
        <p>Amount: {{ item.quantity }}</p>

        <button (click)="remove(item.product.id)">Remove ❌</button>
      </div>
    </div>

    <h2>Total: {{ getTotal() }} $</h2>
  </div>

  <div class="cart-panel">
    <h1>Checkout 🧾</h1>

    <form (ngSubmit)="submitOrder()" #form="ngForm">
      <div class="form-margin">
        <label>Full name:</label>
        <input
          type="text"
          [(ngModel)]="name"
          name="name"
          required
          minlength="3"
          placeholder="Enter your full name"
          (ngModelChange)="validateName($event)"
        />
        <p class="error" *ngIf="nameError">{{ nameError }}</p>
      </div>

      <div class="form-margin">
        <label>Address:</label>
        <input
          type="text"
          [(ngModel)]="address"
          name="address"
          required
          minlength="5"
          placeholder="Enter your address"
          (ngModelChange)="validateAddress($event)"
        />
        <p class="error" *ngIf="addressError">{{ addressError }}</p>
      </div>

      <div class="form-margin">
        <label>Credit card number:</label>
        <input
          type="text"
          [(ngModel)]="cardNumber"
          name="cardNumber"
          required
          minlength="5"
          placeholder="Enter your credit card number"
          (ngModelChange)="validateCard($event)"
        />
        <p class="error" *ngIf="cardError">{{ cardError }}</p>
      </div>

      <button type="submit" [disabled]="form.invalid">Submit</button>
    </form>
  </div>
</div>
