<div class="product-container">
  <ng-container *ngIf="products$ | async as products">
    <div *ngIf="products.length > 0">
      <div class="product-index">
        <app-product-item
          *ngFor="let product of products"
          [product]="product"
          (notify)="showMessage($event)"
        ></app-product-item>
      </div>
    </div>
  </ng-container>
</div>
